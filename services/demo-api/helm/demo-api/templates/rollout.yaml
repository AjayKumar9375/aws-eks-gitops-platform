{{- if .Values.rollout.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
{{ include "demo-api.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit }}
  selector:
    matchLabels:
{{ include "demo-api.selectorLabels" . | indent 6 }}
  strategy:
    canary:
      maxSurge: {{ .Values.rollout.canary.maxSurge }}
      maxUnavailable: {{ .Values.rollout.canary.maxUnavailable }}
      steps:
{{ toYaml .Values.rollout.canary.steps | indent 8 }}
      analysis:
        templates:
        - templateName: {{ include "demo-api.fullname" . }}-success-rate
        startingStep: {{ .Values.rollout.canary.analysis.startingStep }}
        args:
        - name: service-name
          value: {{ include "demo-api.fullname" . }}
  template:
    metadata:
      labels:
{{ include "demo-api.labels" . | indent 8 }}
    spec:
      serviceAccountName: {{ include "demo-api.fullname" . }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
      - name: demo-api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
{{ toYaml .Values.securityContext | indent 10 }}
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
{{ toYaml .Values.resources | indent 10 }}
{{- end }}
