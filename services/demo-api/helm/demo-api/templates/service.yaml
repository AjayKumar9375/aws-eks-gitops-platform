apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-api.fullname" . }}
  labels:
{{ include "demo-api.labels" . | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
{{ include "demo-api.selectorLabels" . | indent 4 }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: http
    name: http
