apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-api-rules
  namespace: monitoring
spec:
  groups:
  - name: demo-api.rules
    rules:
    - alert: DemoApiHighErrorRate
      expr: sum(rate(demo_api_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(demo_api_requests_total[5m])), 1) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High 5xx error rate in demo-api"
